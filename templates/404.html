{% extends "base.html" %}

{% block title %}Page not found · Habit Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="empty-state text-center">
      <div class="empty-mark">🔍</div>
      <h1 class="h4">Page not found</h1>
      <p class="text-muted mb-3">
        This page does not exist, or the habit belongs to another account.
      </p>
      <a class="btn btn-primary" href="{{ url_for('habits.dashboard') if current_user.is_authenticated else url_for('auth.login') }}">
        Go to the dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
