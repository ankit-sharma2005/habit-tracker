{% extends "base.html" %}

{% block title %}Log in · Habit Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card auth-card shadow-sm">
      <div class="card-body p-4 p-md-5">

        <h1 class="h4 mb-1">Welcome back</h1>
        <p class="text-muted small mb-4">Log in to tick off today's habits and watch your streaks grow.</p>

        <form method="post" action="{{ url_for('auth.login') }}" novalidate>
          {# Keeps ?next=/streaks working after the login round-trip. #}
          <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

          <div class="mb-3">
            <label class="form-label" for="identifier">Username or email</label>
            <input class="form-control" id="identifier" name="identifier" type="text"
                   value="{{ identifier }}" autofocus required autocomplete="username">
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password"
                   required autocomplete="current-password">
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember" name="remember" value="1">
            <label class="form-check-label" for="remember">Remember me on this device</label>
          </div>

          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="text-center text-muted small mt-4 mb-0">
          New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
        </p>

      </div>
    </div>
  </div>
</div>
{% endblock %}
